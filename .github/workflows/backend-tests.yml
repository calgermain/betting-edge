name: Backend offline tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: betting-edge-backend/betting-edge-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Run offline tests
        run: python -m pytest -q
      - name: Check frontend JavaScript syntax
        working-directory: .
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inside = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      attributes = dict(attrs)
                      self.inside = not attributes.get('src') and attributes.get('type', 'text/javascript') in ('text/javascript', 'module', '')
                      self.parts = []
              def handle_data(self, data):
                  if self.inside:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self.inside:
                      self.scripts.append(''.join(self.parts))
                      self.inside = False
          parser = Scripts()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          assert parser.scripts, 'No inline JavaScript found'
          Path('/tmp/betting-edge-inline.js').write_text('\n'.join(parser.scripts), encoding='utf-8')
          PY
          node --check /tmp/betting-edge-inline.js
